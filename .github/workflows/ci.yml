name: Windows Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Install Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component llvm-tools-preview,rustfmt,clippy
      - name: Build helper and TypeScript
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Rust tests
        run: npm run test:native
      - name: Clippy
        run: node scripts/rust.mjs clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: TypeScript and isolated process tests
        run: node node_modules/tsx/dist/cli.mjs --test tests/*.test.ts tests/integration/*.test.ts
      - name: Extension contract
        run: npm run check:extension
      - name: Package verification
        run: npm run verify:package
      - name: Review tarball inventory
        run: npm pack --ignore-scripts --dry-run
